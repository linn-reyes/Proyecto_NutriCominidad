<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriComunidad - Detalle de alimento</title>
    <link rel="stylesheet" href="./src/css/detalle.css" />
  </head>

  <body data-modulo="alimentos-admin">
    <div id="header-container"></div>

    <main class="main">
      <a class="main__volver" href="alimentos-admin.html"
        >&larr; Volver al catálogo</a
      >

      <p class="mensaje" id="mensaje-no-existe" hidden>
        El alimento no existe.
      </p>

      <section class="detalle" id="detalle">
        <h2 class="detalle__titulo" id="titulo">Detalle del alimento</h2>
        <dl class="detalle__datos" id="datos"></dl>
        <div class="detalle__acciones">
          <a
            class="detalle__boton"
            id="boton-editar"
            href="alimento-form-admin.html"
            >Editar</a
          >
        </div>
      </section>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="./src/js/detalle.js"></script>
  </body>
</html>
