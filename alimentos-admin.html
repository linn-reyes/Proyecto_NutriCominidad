<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriComunidad - Catálogo de alimentos</title>
    <link rel="stylesheet" href="./src/css/lista.css" />
  </head>

  <body data-modulo="alimentos-admin">
    <div id="header-container"></div>

    <main class="main">
      <a class="main__volver" href="home-admin.html">&larr; Volver al inicio</a>

      <section class="encabezado">
        <h2 class="encabezado__titulo">Catálogo de alimentos</h2>
        <p class="encabezado__texto">
          Los alimentos activos son los que pueden usar los comercios y las
          recetas.
        </p>
        <a class="encabezado__boton" href="alimento-form-admin.html"
          >Agregar alimento</a
        >
      </section>

      <p class="mensaje" id="mensaje-vacio" hidden>
        Aún no hay alimentos en el catálogo.
      </p>

      <div class="tabla">
        <table class="tabla__tabla">
          <thead>
            <tr>
              <th>Alimento</th>
              <th>Categoría</th>
              <th>Unidad</th>
              <th>Calorías</th>
              <th>Estado</th>
              <th>Detalle</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="./src/js/lista.js"></script>
  </body>
</html>
