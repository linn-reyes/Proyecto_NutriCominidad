<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriComunidad - Alimentos por caducar</title>
    <link rel="stylesheet" href="./src/css/lista.css">
</head>

<body data-modulo="lotes">

    <div id="header-container"></div>

    <main class="main">
        <a class="main__volver" href="home-comercio.html">&larr; Volver al inicio</a>

        <section class="encabezado">

                    <tr>
                        <th>Alimento</th>
                        <th>Stock</th>

    <div id="footer-container"></div>

    <script type="module" src="./src/js/lista.js"></script>
