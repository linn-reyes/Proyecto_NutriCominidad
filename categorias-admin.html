<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriComunidad - Categorías</title>
    <link rel="stylesheet" href="./src/css/lista.css" />
  </head>

  <body data-modulo="categorias-admin">
    <div id="header-container"></div>

    <main class="main">
      <a class="main__volver" href="home-admin.html">&larr; Volver al inicio</a>

      <section class="encabezado">
        <h2 class="encabezado__titulo">Categorías</h2>
        <p class="encabezado__texto">
          Agrupan los alimentos del catálogo por tipo.
        </p>
        <a class="encabezado__boton" href="categoria-form-admin.html"
          >Agregar categoría</a
        >
      </section>

      <p class="mensaje" id="mensaje-vacio" hidden>Aún no hay categorías.</p>

      <div class="tabla">
        <table class="tabla__tabla">
          <thead>
            <tr>
              <th>Categoría</th>
              <th>Descripción</th>
              <th>Alimentos</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="./src/js/lista.js"></script>
  </body>
</html>
