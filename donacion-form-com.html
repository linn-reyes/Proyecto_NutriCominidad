<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriComunidad - Donación</title>
    <link rel="stylesheet" href="./src/css/formulario.css">
</head>

<body data-modulo="donaciones">

    <div id="header-container"></div>

    <main class="main">
        <a class="main__volver" href="donaciones-com.html">&larr; Volver a donaciones</a>

        <section class="seccion">
            <h2 class="seccion__titulo" id="titulo">Nueva donación</h2>
            <p class="seccion__texto">Registra los alimentos que entregas a una organización.</p>

            <form class="formulario" id="formulario" action="#" method="post">
                <div class="formulario__campo">
                    <label class="formulario__etiqueta" for="ID_Organizacion">Organización:</label>
                    <select class="formulario__select" id="ID_Organizacion" name="ID_Organizacion" required>
                        <option value="">Selecciona una organización</option>
                    </select>
                </div>

                <div class="formulario__campo">
                    <label class="formulario__etiqueta" for="Fecha_Donacion">Fecha de donación:</label>
                    <input class="formulario__input" type="date" id="Fecha_Donacion" name="Fecha_Donacion" required>
                </div>

                <div class="formulario__campo">
                    <label class="formulario__etiqueta" for="Cantidad">Cantidad total:</label>
                    <input class="formulario__input" type="number" id="Cantidad" name="Cantidad" min="1" required>
                </div>

                <div class="formulario__campo">
                    <label class="formulario__etiqueta" for="Estado">Estado:</label>
                    <select class="formulario__select" id="Estado" name="Estado" required>
                        <option value="">Selecciona una opción</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Entregada">Entregada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                </div>

                <div class="formulario__campo">
                    <label class="formulario__etiqueta" for="Observaciones">Observaciones (opcional):</label>
                    <textarea class="formulario__input" id="Observaciones" name="Observaciones" rows="3" maxlength="200"></textarea>
                </div>

                <p class="formulario__mensaje" id="mensaje-formulario" hidden></p>

                <div class="formulario__acciones">
                    <button class="formulario__boton" type="submit">Guardar</button>
                    <a class="formulario__cancelar" href="donaciones-com.html">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="./src/js/formulario.js"></script>
</body>

</html>
