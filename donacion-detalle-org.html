<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriComunidad - Detalle de donación recibida</title>
    <link rel="stylesheet" href="./src/css/detalle.css">
</head>

<body data-modulo="donaciones-org">

    <div id="header-container"></div>

    <main class="main">
        <a class="main__volver" href="donaciones-org.html">&larr; Volver a donaciones recibidas</a>

        <p class="mensaje" id="mensaje-no-existe" hidden>La donación no existe.</p>

        <section class="detalle" id="detalle">
            <h2 class="detalle__titulo" id="titulo">Detalle de la donación</h2>
            <dl class="detalle__datos" id="datos"></dl>
            <div class="detalle__acciones">
                <button class="detalle__boton" id="boton-confirmar" type="button" hidden>Confirmar recepción</button>
            </div>
            <p class="mensaje" id="mensaje-confirmado" role="status" hidden>Recepción confirmada.</p>
        </section>

        <section class="detalle" id="seccion-alimentos">
            <h3 class="detalle__subtitulo">Alimentos donados</h3>
            <p class="mensaje" id="mensaje-sin-alimentos" hidden>Esta donación no tiene alimentos registrados.</p>
            <div class="tabla">
                <table class="tabla__tabla">
                    <thead>
                        <tr>
                            <th>Alimento</th>
                            <th>Cantidad</th>
                            <th>Unidad</th>
                        </tr>
                    </thead>
                    <tbody id="alimentos-donados"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="./src/js/detalle.js"></script>
</body>

</html>
