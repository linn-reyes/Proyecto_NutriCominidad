<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriComunidad - Recetas</title>
    <link rel="stylesheet" href="./src/css/lista.css" />
  </head>

  <body data-modulo="recetas-admin">
    <div id="header-container"></div>

    <main class="main">
      <a class="main__volver" href="home-admin.html">&larr; Volver al inicio</a>

      <section class="encabezado">
        <h2 class="encabezado__titulo">Recetas</h2>
        <p class="encabezado__texto">
          Recetas económicas que se recomiendan a los usuarios.
        </p>
        <a class="encabezado__boton" href="receta-form-admin.html"
          >Agregar receta</a
        >
      </section>

      <p class="mensaje" id="mensaje-vacio" hidden>
        Aún no hay recetas registradas.
      </p>

      <div class="tabla">
        <table class="tabla__tabla">
          <thead>
            <tr>
              <th>Receta</th>
              <th>Tiempo</th>
              <th>Porciones</th>
              <th>Costo</th>
              <th>Detalle</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="./src/js/lista.js"></script>
  </body>
</html>
